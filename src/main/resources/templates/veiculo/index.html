<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div class="topo"><h1>Veículos</h1><a class="btn btn-sec" th:href="@{/reservas}">Reservas</a></div>

    <div class="msg msg-ok" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="msg msg-erro" th:if="${erro}" th:text="${erro}"></div>

    <a th:href="@{/veiculos/novo}" class="btn">
        Cadastrar veículo
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Placa</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Ano</th>
            <th>Cor</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="veiculo : ${veiculos}">

            <td th:text="${veiculo.id}"></td>

            <td th:text="${veiculo.placa}"></td>

            <td th:text="${veiculo.marca}"></td>

            <td th:text="${veiculo.modelo}"></td>

            <td th:text="${veiculo.ano}"></td>

            <td th:text="${veiculo.cor}"></td>

            <td>

                <a th:href="@{/veiculos/{id}/editar(id=${veiculo.id})}">
                    Editar
                </a>

                <form th:action="@{/veiculos/{id}/excluir(id=${veiculo.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit"
                            onclick="return confirm('Deseja realmente excluir este veículo?');">
                        Excluir
                    </button>

                </form>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(veiculos)}">
            <td colspan="7" class="vazio">
                Nenhum veículo cadastrado.
            </td>
        </tr>

        </tbody>
    </table>

</div>

</body>
</html>
