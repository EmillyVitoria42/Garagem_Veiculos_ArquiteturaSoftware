<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Veículo</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div class="msg msg-erro" th:if="${erro}" th:text="${erro}"></div>

    <h1 th:text="${titulo != null ? titulo : (veiculo.id == 0 ? 'Cadastrar veículo' : 'Editar veículo')}">
        Cadastro de Veículo
    </h1>

    <form th:action="${veiculo.id == 0
        ? '/veiculos'
        : '/veiculos/' + veiculo.id + '/editar'}"
          th:object="${veiculo}"
          method="post">

        <div>
            <label for="placa">Placa:</label>

            <input
                    type="text"
                    id="placa"
                    th:field="*{placa}"
                    required>
        </div>

        <div>
            <label for="marca">Marca:</label>

            <input
                    type="text"
                    id="marca"
                    th:field="*{marca}"
                    required>
        </div>

        <div>
            <label for="modelo">Modelo:</label>

            <input
                    type="text"
                    id="modelo"
                    th:field="*{modelo}"
                    required>
        </div>

        <div>
            <label for="ano">Ano:</label>

            <input
                    type="number"
                    id="ano"
                    th:field="*{ano}"
                    required>
        </div>

        <div>
            <label for="cor">Cor:</label>

            <input
                    type="text"
                    id="cor"
                    th:field="*{cor}">
        </div>

        <div>

            <button type="submit">
                Salvar
            </button>

            <a class="btn btn-sec" th:href="@{/veiculos}">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
